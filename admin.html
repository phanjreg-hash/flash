<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Admin - API Defaults</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:24px}
    textarea{width:100%;height:440px;font-family:monospace;font-size:13px}
    .row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
    .btn{padding:8px 12px;border-radius:6px;background:#4f46e5;color:white;border:none}
  </style>
</head>
<body>
  <h1>Admin — API Defaults</h1>
  <p>Enter admin password and edit the provider defaults JSON. Changes will be committed to the GitHub repo.</p>
  <div class="row">
    <input id="admin-pass" type="password" placeholder="Admin password" style="padding:8px;border-radius:6px;border:1px solid #ccc" />
    <button id="load-btn" class="btn">Load</button>
    <button id="save-btn" class="btn" style="background:#059669">Save</button>
    <span id="status" style="margin-left:12px;color:#666"></span>
  </div>
  <textarea id="defaults"></textarea>

  <script>
    async function loadDefaults() {
      document.getElementById('status').textContent = 'Loading...';
      try {
        const r = await fetch('/api/admin/defaults');
        if (!r.ok) throw new Error(await r.text());
        const data = await r.json();
        document.getElementById('defaults').value = JSON.stringify(data.content, null, 2);
        document.getElementById('status').textContent = 'Loaded';
      } catch (e) {
        document.getElementById('status').textContent = 'Error: ' + e.message;
      }
    }

    async function saveDefaults() {
      const pass = document.getElementById('admin-pass').value.trim();
      if (!pass) { alert('Enter admin password'); return; }
      let parsed;
      try { parsed = JSON.parse(document.getElementById('defaults').value); } catch (e) { alert('Invalid JSON: ' + e.message); return; }
      document.getElementById('status').textContent = 'Saving...';
      try {
        const r = await fetch('/api/admin/defaults', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ password: pass, content: parsed }) });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || JSON.stringify(data));
        document.getElementById('status').textContent = 'Saved — commit: ' + (data.commit && data.commit.sha ? data.commit.sha.slice(0,7) : 'ok');
      } catch (e) {
        document.getElementById('status').textContent = 'Error: ' + e.message;
      }
    }

    document.getElementById('load-btn').addEventListener('click', loadDefaults);
    document.getElementById('save-btn').addEventListener('click', saveDefaults);
    // Auto-load
    window.addEventListener('load', loadDefaults);
  </script>
</body>
</html>
